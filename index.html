<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>デカブサ占い</title>
  <style>
    :root{
      --bg:#f7f7f7;
      --card:#ffffff;
      --line:#e6e6e6;
      --text:#111;
      --muted:#666;
      --muted2:#9a9a9a;
      --accent:#ffd400;

      --maxw:520px;
      --btnH: 58px;
      --safeB: env(safe-area-inset-bottom, 0px);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    [hidden]{ display:none !important; }

    .wrap{
      min-height: 100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }
    .card{
      width: min(var(--maxw), 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow:hidden;
      position: relative;
    }
    header{
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap:10px;
    }
    .headLeft{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .dot{
      width:10px; height:10px;
      border-radius:50%;
      background: var(--accent);
      flex:0 0 auto;
    }
    h1{
      font-size:14px;
      font-weight:700;
      margin:0;
      letter-spacing:.08em;
      color:var(--muted);
      white-space: nowrap;
    }
    #quota{
      font-size: 12px;
      color: var(--muted2);
      letter-spacing: .08em;
      white-space: nowrap;
      user-select:none;
    }

    main{
      padding: 18px;
      min-height: 620px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ===== TOP ===== */
    .top{
      text-align:center;
      padding: 22px 10px 26px;
    }
    .topTitle{
      margin-top: 6px;
      font-size: clamp(20px, 5.8vw, 30px);
      font-weight: 700;
      letter-spacing:.06em;
      line-height:1.45;
    }
    .topCopy{
      margin-top: 18px;
      font-size: clamp(26px, 7.2vw, 40px);
      font-weight: 800;
      letter-spacing:.06em;
      line-height:1.25;
      white-space: pre-line;
    }
    .tapHint{
      margin: 18px 0 0;
      font-size: 13px;
      color: rgba(0,0,0,0.22);
      letter-spacing: .14em;
      user-select:none;
      animation: hintBlink 1.25s ease-in-out infinite;
    }
    @keyframes hintBlink{
      0%,100%{ opacity: .20; }
      50%    { opacity: .90; }
    }
    .hero{
      margin: 28px auto 0;
      width: min(260px, 70%);
      display:flex;
      justify-content:center;
      align-items:flex-end;
    }
    #topImg{
      width: 100%;
      height:auto;
      display:block;
      transform-origin: 50% 100%;
      animation: bob 3.6s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes bob{
      0%,100%{ transform: translateY(0px) rotate(-0.2deg); }
      50%    { transform: translateY(-6px) rotate(0.2deg); }
    }
    .miniNote{
      margin-top: 14px;
      font-size: 12px;
      color: rgba(0,0,0,0.34);
      letter-spacing: .06em;
      line-height: 1.7;
    }

    /* ===== FOOTER (TOP) ===== */
    .footer{
      border-top: 1px solid var(--line);
      padding: 14px 12px calc(14px + var(--safeB));
      background:#fff;
    }
    button{
      appearance:none;
      border:1px solid rgba(0,0,0,0.08);
      background:#fafafa;
      color:#111;
      border-radius: 18px;
      padding: 14px 18px;
      font-size:18px;
      cursor:pointer;
      transition: transform .12s ease, opacity .12s ease;
      min-height: var(--btnH);
    }
    button:active{
      transform: translateY(1px) scale(0.99);
      background:#f2f2f2;
    }
    .primary{
      border:none;
      background:#111;
      color:#fff;
      border-radius: 28px;
      letter-spacing:.12em;
      width: min(320px, 92%);
      margin: 0 auto;
      display:block;
    }
    .locked button{
      opacity:.35;
      pointer-events:none;
      cursor: default;
    }

    /* ===== GAME ===== */
    .game{
      display:flex;
      flex-direction:column;
      min-height: 620px;
      text-align:center;
    }
    #progress{
      font-size: 12px;
      color: var(--muted2);
      letter-spacing:.14em;
      margin: 6px 0 0;
      user-select:none;
    }
    #question{
      margin: 22px 0 0;
      font-size: clamp(20px, 6.0vw, 30px);
      line-height: 1.45;
      letter-spacing: .06em;
      white-space: pre-line;
      min-height: 3.2em;
    }
    .spacer{
      flex: 1 1 auto;
      min-height: 18px;
    }
    .charBottom{
      display:flex;
      justify-content:center;
      align-items:flex-end;
      padding: 6px 0 8px;
    }
    #charImg{
      width: 240px;
      height:auto;
      user-select:none;
      pointer-events:none;
      transition: opacity 0.15s;
    }
    .answers{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 6px 6px;
    }
    .answers button{
      width: 100%;
      font-size: 18px;
      border-radius: 18px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.10);
      min-height: 64px;
    }

    /* ===== RESULT ===== */
    .result{
      display:flex;
      flex-direction:column;
      min-height: 620px;
      text-align:center;
      padding: 6px 0 0;
    }
    .resultHead{ padding-top: 10px; }
    .resultTitle{
      font-size: 18px;
      margin: 0;
      letter-spacing:.06em;
      color:#111;
    }
    #percentBig{
      margin-top: 16px;
      font-size: 74px;
      font-weight: 900;
      letter-spacing: .04em;
      line-height: 1;
    }
    .subCap{
      margin-top: 10px;
      color:#666;
      letter-spacing:.12em;
      font-size:12px;
    }
    #rankText{
      margin-top: 10px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing:.08em;
    }
    #resultLines{
      margin-top: 12px;
      white-space: pre-line;
      font-size: 16px;
      line-height: 1.9;
      color:#111;
      padding: 0 12px;
    }

    /* 複数運 */
    .stats{
      margin: 16px auto 0;
      width: min(420px, 92%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background:#fff;
      text-align:left;
    }
    .statRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 6px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .statRow:last-child{ border-bottom:none; }
    .statName{
      font-size: 14px;
      font-weight: 800;
      letter-spacing:.06em;
      color:#111;
      min-width: 5.5em;
    }
    .statRight{
      display:flex;
      align-items:center;
      gap:10px;
      width: 100%;
      justify-content:flex-end;
    }
    .bar{
      flex: 1 1 auto;
      height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.08);
      overflow:hidden;
      max-width: 220px;
    }
    .bar > i{
      display:block;
      height:100%;
      width: 0%;
      background: #111;
      border-radius: 999px;
      transition: width .6s ease;
    }
    .statVal{
      font-size: 14px;
      font-weight: 900;
      letter-spacing:.04em;
      width: 3.2em;
      text-align:right;
    }

    .actions{
      padding: 14px 0 8px;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
      justify-content:center;
    }
    .adoptBtn{
      width: min(360px, 92%);
      border:none;
      background:#111;
      color:#fff;
      border-radius: 14px;
      font-size: 18px;
      min-height: 56px;
      letter-spacing:.06em;
    }
    .nextBtn{
      width: min(360px, 92%);
      border:1px solid rgba(0,0,0,0.10);
      background:#fff;
      color:#111;
      border-radius: 14px;
      font-size: 18px;
      min-height: 56px;
    }
    .smallHint{
      font-size: 12px;
      color: rgba(0,0,0,0.40);
      letter-spacing:.06em;
      line-height: 1.7;
      padding: 0 12px;
    }

    /* ===== Modal ===== */
    .modalBack{
      position: fixed;
      inset:0;
      background: rgba(0,0,0,0.35);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 999;
    }
    .modalBack.on{ display:flex; }
    .modal{
      width: min(520px, 100%);
      background:#fff;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.08);
      overflow:hidden;
    }
    .modalHead{
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap:10px;
    }
    .modalTitle{
      font-size: 14px;
      font-weight: 700;
      letter-spacing:.08em;
      color: var(--muted);
      margin:0;
    }
    .modalBody{
      padding: 16px;
      text-align:center;
    }
    .charStage{
      margin-top: 6px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .navBtn{
      width:44px;
      min-width:44px;
      height:44px;
      padding:0;
      border-radius: 14px;
      font-size: 18px;
    }
    .charCard{
      width: min(320px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px 14px;
      background: #fff;
    }
    .charName{
      font-weight: 900;
      letter-spacing:.08em;
      margin: 6px 0 8px;
    }
    .charDesc{
      color: var(--muted2);
      font-size: 12px;
      line-height: 1.7;
      letter-spacing:.04em;
      min-height: 3.4em;
    }
    .charPreview{
      width: 220px;
      height:auto;
      display:block;
      margin: 0 auto;
    }
    .modalFoot{
      border-top: 1px solid var(--line);
      padding: 12px;
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
      background:#fff;
    }

    .fadeLayer{
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: opacity .30s ease;
    }
    .fadeLayer.on{ opacity: 1; pointer-events: auto; }

    @media (max-width: 420px){
      main{ min-height: 560px; }
      .game, .result{ min-height: 560px; }
      #charImg{ width: 220px; }
      #percentBig{ font-size: 64px; }
      .answers button{ min-height: 62px; }
    }
    @media (prefers-reduced-motion: reduce){
      #topImg, .tapHint{ animation:none!important; }
      .fadeLayer{ transition:none; }
      .bar > i{ transition:none; }
    }
  </style>
</head>

<body>
  <div class="fadeLayer" id="fade"></div>

  <div class="wrap">
    <div class="card">
      <header>
        <div class="headLeft">
          <div class="dot"></div>
          <h1>デカブサ占い</h1>
        </div>
        <div id="quota">今日はあと∞回</div>
      </header>

      <main id="main">

        <!-- ===== TOP ===== -->
        <section id="screenTop" class="top">
          <div class="topTitle">あなたの運勢はどう？</div>
          <div class="topCopy">98%の人が
外れたと回答</div>
          <div class="tapHint">タップして</div>

          <div class="hero">
            <img id="topImg" src="dekabusa.png" alt="トップキャラ">
          </div>

          <div class="miniNote" id="topMini">※当たったと思っても外れています</div>
        </section>

        <!-- ===== GAME ===== -->
        <section id="screenGame" class="game" hidden>
          <div id="progress">1 / 7</div>
          <div id="question">読み込み中</div>

          <div class="spacer"></div>

          <div class="charBottom">
            <img id="charImg" src="" alt="キャラ">
          </div>

          <div class="answers" id="answers">
            <button type="button" data-a="0">当たった</button>
            <button type="button" data-a="1">外れた</button>
            <button type="button" data-a="2">知らん</button>
            <button type="button" data-a="3">気のせい</button>
          </div>
        </section>

        <!-- ===== RESULT ===== -->
        <section id="screenResult" class="result" hidden>
          <div class="resultHead">
            <p class="resultTitle">今日のあなたの運勢は</p>

            <div id="percentBig">0%</div>

            <div class="subCap">総合運</div>
            <div id="rankText"></div>

            <div id="resultLines"></div>

            <div class="stats" id="statsBox" aria-label="詳細運勢">
              <div class="statRow">
                <div class="statName">金運</div>
                <div class="statRight">
                  <div class="bar"><i id="barMoney"></i></div>
                  <div class="statVal" id="valMoney">0%</div>
                </div>
              </div>
              <div class="statRow">
                <div class="statName">恋愛運</div>
                <div class="statRight">
                  <div class="bar"><i id="barLove"></i></div>
                  <div class="statVal" id="valLove">0%</div>
                </div>
              </div>
              <div class="statRow">
                <div class="statName">仕事運</div>
                <div class="statRight">
                  <div class="bar"><i id="barWork"></i></div>
                  <div class="statVal" id="valWork">0%</div>
                </div>
              </div>
              <div class="statRow">
                <div class="statName">健康運</div>
                <div class="statRight">
                  <div class="bar"><i id="barHealth"></i></div>
                  <div class="statVal" id="valHealth">0%</div>
                </div>
              </div>
            </div>
          </div>

          <div class="spacer"></div>

          <div class="charBottom" style="padding-bottom:0;">
            <img id="resultChar" src="" alt="キャラ（結果）" style="width:220px; height:auto; transition:opacity 0.15s;">
          </div>

          <div class="actions">
            <button class="adoptBtn" id="btnAdopt" type="button">採用して明日に保存</button>
            <button class="nextBtn" id="btnNextChar" type="button">次のキャラを占う</button>
            <div class="smallHint" id="forceHint" hidden>※最後まで行ったら、最後の結果が採用になります（ボタンは押してね）</div>
          </div>
        </section>

      </main>

      <!-- ===== FOOTER (TOP) ===== -->
      <div class="footer" id="footerTop">
        <button id="btnStart" class="primary" type="button">START</button>
      </div>

    </div>
  </div>

  <!-- ===== 仲間紹介モーダル（必ず選択） ===== -->
  <div class="modalBack" id="modalBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="仲間紹介">
      <div class="modalHead">
        <p class="modalTitle">仲間紹介</p>
        <div style="font-size:12px;color:#9a9a9a;letter-spacing:.08em;">必ず選択</div>
      </div>

      <div class="modalBody">
        <div class="charStage">
          <button class="navBtn" id="btnPrev" type="button">‹</button>

          <div class="charCard">
            <img id="pickImg" class="charPreview" src="dekabusa.png" alt="">
            <div class="charName" id="pickName">デカブサ</div>
            <div class="charDesc" id="pickDesc">まあ…やるだけやれ。</div>
          </div>

          <button class="navBtn" id="btnNext" type="button">›</button>
        </div>

        <div class="miniNote">
          追加キャラは、表示と文言が変わるだけです。<br>
          中身は変わりません。
        </div>
      </div>

      <div class="modalFoot">
        <button id="btnChoose" class="primary" type="button">このキャラにする</button>
      </div>
    </div>
  </div>

  <script>
    // =========================
    // Storage Keys
    // =========================
    const KEY_STATE  = "dekaFortune_state_v1";    // 今日の進行/使用済み
    const KEY_ADOPT  = "dekaFortune_adopt_v1";    // 明日用に採用された結果（確定）
    const KEY_PENDING= "dekaFortune_pending_v1";  // 親切②：押し忘れ救済用（仮採用）
    const KEY_COUNTS = "dekaFortune_pickCounts_v1";
    const KEY_LASTTOP= "dekaFortune_lastTopChar_v1";

    // =========================
    // Utils: dates
    // =========================
    function pad2(n){ return String(n).padStart(2,"0"); }
    function ymd(d){
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    }
    function tomorrowYmd(){
      const d = new Date();
      d.setDate(d.getDate()+1);
      return ymd(d);
    }
    const TODAY = ymd(new Date());

    // =========================
    // Screen control (hidden統一)
    // =========================
    const screenTop    = document.getElementById("screenTop");
    const screenGame   = document.getElementById("screenGame");
    const screenResult = document.getElementById("screenResult");
    const footerTop    = document.getElementById("footerTop");
    const fade         = document.getElementById("fade");
    const mainEl       = document.getElementById("main");

    function setScreen(name){
      screenTop.hidden    = name !== "top";
      screenGame.hidden   = name !== "game";
      screenResult.hidden = name !== "result";
      footerTop.hidden    = name !== "top";
      mainEl.scrollTop = 0;
      window.scrollTo(0,0);
    }

    // =========================
    // Characters (img1/img2で動き)
    // =========================
    const CHAR_LIST = [
      { id:"dekabusa", name:"デカブサ",   img1:"dekabusa_1.png",  img2:"dekabusa_2.png", desc:"まあ…やるだけやれ。" },
      { id:"lion",     name:"ライオン丸", img1:"lionmaru_1.png",  img2:"lionmaru_2.png", desc:"……黙って見ろ。" },
      { id:"namaken",  name:"ナマケン",   img1:"namaken_1.png",   img2:"namaken_2.png",  desc:"…うん…まあ…" },
      { id:"tora",     name:"とらさん",   img1:"torasan_1.png",   img2:"torasan_2.png",  desc:"よし。次いくか。" },
      { id:"kane",     name:"カンえもん", img1:"kanemon_1.png",   img2:"kanemon_2.png",  desc:"（入ってる）三次元だ。" },
    ];

    // =========================
    // Questions
    // =========================
    const Q = [
      "今日は様子見したい？",
      "深く考えたくない？",
      "とりあえず寝たい？",
      "早く帰りたい？",
      "今はその時じゃないと思う？",
      "気にするだけ損だと思う？",
      "今日は静かに過ごしたい？",
      "何もしない日も価値があると思う？",
      "急ぐ必要はないと思う？",
      "なんとかなると思う？",
      "今日は面倒を避けたい？",
      "動くより止まる方が楽？",
      "結局、気のせいだと思う？"
    ];
    function pick7(){
      const copy = [...Q];
      const out = [];
      while(out.length < 7 && copy.length){
        const j = Math.floor(Math.random()*copy.length);
        out.push(copy.splice(j,1)[0]);
      }
      return out;
    }

    // =========================
    // Rank + lines
    // =========================
    function getRank(p){
      if(p <= 19) return "絶不調";
      if(p <= 39) return "低調";
      if(p <= 60) return "静穏";   // ★40〜60を静穏ゾーン
      if(p <= 79) return "好調";
      return "絶好調";
    }

    function buildLines(overall, rank){
      // ★50%だけ特別
      if(overall === 50){
        return [
          "静穏運 100%",
          "Perfectly Average",
          "",
          "今日は派手な事件は起きない。安心。",
          "何も壊れていない日。"
        ].join("\n");
      }
      const MAP = {
        "絶不調": ["今日は運勢が良くない。","どうせ外れるから気にするな。"],
        "低調":   ["今日は少し流れが悪い。","まあ、そんな日もある。"],
        "静穏":   ["今日は普通。","特別ではないが問題もない。"],
        "好調":   ["今日は悪くない。","少しだけ動いてもいいかもしれない。"],
        "絶好調": ["今日はかなり良い流れ。","珍しい日だ。"]
      };
      return (MAP[rank] || ["今日はそんな日。","気にするな。"]).join("\n");
    }

    // =========================
    // DOM
    // =========================
    const btnStart   = document.getElementById("btnStart");
    const topImg     = document.getElementById("topImg");
    const topMini    = document.getElementById("topMini");

    const progressEl = document.getElementById("progress");
    const questionEl = document.getElementById("question");
    const charImg    = document.getElementById("charImg");
    const answersEl  = document.getElementById("answers");

    const percentBig = document.getElementById("percentBig");
    const rankText   = document.getElementById("rankText");
    const resultLines= document.getElementById("resultLines");
    const resultChar = document.getElementById("resultChar");

    const barMoney  = document.getElementById("barMoney");
    const barLove   = document.getElementById("barLove");
    const barWork   = document.getElementById("barWork");
    const barHealth = document.getElementById("barHealth");

    const valMoney  = document.getElementById("valMoney");
    const valLove   = document.getElementById("valLove");
    const valWork   = document.getElementById("valWork");
    const valHealth = document.getElementById("valHealth");

    const btnAdopt   = document.getElementById("btnAdopt");
    const btnNextChar= document.getElementById("btnNextChar");
    const forceHint  = document.getElementById("forceHint");

    // Modal
    const modalBack  = document.getElementById("modalBack");
    const btnPrev    = document.getElementById("btnPrev");
    const btnNext    = document.getElementById("btnNext");
    const btnChoose  = document.getElementById("btnChoose");
    const pickImg    = document.getElementById("pickImg");
    const pickName   = document.getElementById("pickName");
    const pickDesc   = document.getElementById("pickDesc");
    let pickIndex = 0;

    function openModal(){
      pickIndex = 0;
      renderPick();
      modalBack.classList.add("on");
      modalBack.setAttribute("aria-hidden","false");
    }
    function closeModal(){
      modalBack.classList.remove("on");
      modalBack.setAttribute("aria-hidden","true");
    }
    function renderPick(){
      const c = CHAR_LIST[pickIndex];
      pickImg.src = c.img1;
      pickImg.alt = c.name;
      pickName.textContent = c.name;
      pickDesc.textContent = c.desc;
    }
    btnPrev.addEventListener("click", (e)=>{
      e.stopPropagation();
      pickIndex = (pickIndex - 1 + CHAR_LIST.length) % CHAR_LIST.length;
      renderPick();
    });
    btnNext.addEventListener("click", (e)=>{
      e.stopPropagation();
      pickIndex = (pickIndex + 1) % CHAR_LIST.length;
      renderPick();
    });
    modalBack.addEventListener("click", (e)=>{ e.stopPropagation(); });

    // =========================
    // State (1日1キャラ1回)
    // =========================
    function loadState(){
      try{
        const s = JSON.parse(localStorage.getItem(KEY_STATE) || "null");
        if(!s || s.date !== TODAY){
          return { date:TODAY, used: {} }; // used: { charId: true }
        }
        return s;
      }catch{
        return { date:TODAY, used: {} };
      }
    }
    function saveState(s){
      localStorage.setItem(KEY_STATE, JSON.stringify(s));
    }
    let state = loadState();

    function isUsed(charId){ return !!state.used[charId]; }
    function markUsed(charId){
      state.used[charId] = true;
      saveState(state);
    }
    function remainingCount(){
      return CHAR_LIST.filter(c=>!isUsed(c.id)).length;
    }

    // =========================
    // Top character display (採用したキャラをトップに出す)
    // =========================
    function setTopFromStorage(){
      const lastId = localStorage.getItem(KEY_LASTTOP) || "dekabusa";
      const c = CHAR_LIST.find(x=>x.id===lastId) || CHAR_LIST[0];
      topImg.src = c.img1;
      topImg.alt = c.name;
    }
    setTopFromStorage();

    // =========================
    // Fortune generation
    // =========================
    function randNear(base, spread){
      const v = base + Math.floor((Math.random()*2 - 1) * spread);
      return Math.max(0, Math.min(100, v));
    }
    function countUpPercent(el, target, durationMs){
      return new Promise((resolve) => {
        const start = performance.now();
        const to = Math.max(0, Math.min(100, Math.floor(target)));
        function tick(now){
          const t = Math.min(1, (now - start) / durationMs);
          const eased = 1 - Math.pow(1 - t, 3);
          const v = Math.round(to * eased);
          el.textContent = `${v}%`;
          if(t < 1) requestAnimationFrame(tick);
          else resolve();
        }
        requestAnimationFrame(tick);
      });
    }
    function setStat(barEl, valEl, p){
      valEl.textContent = `${p}%`;
      barEl.style.width = `${p}%`;
    }
    function waitMs(ms){ return new Promise(r=>setTimeout(r, ms)); }

    // 7コマ：静→動→静→動→静→動→静
    async function playSequence(imgEl, charObj){
      const img1 = charObj.img1;
      const img2 = charObj.img2 || charObj.img1;
      const sequence = [img1, img2, img1, img2, img1, img2, img1];

      await waitMs(450);
      for(const src of sequence){
        imgEl.style.opacity = 0;
        await waitMs(140);
        imgEl.src = src;
        imgEl.style.opacity = 1;
        await waitMs(300);
      }
    }

    // =========================
    // Pending & Adopt
    // =========================
    // pendingは「押し忘れ救済」用。画面を離れたら採用に昇格（親切②）。
    function setPending(pendingObj){
      localStorage.setItem(KEY_PENDING, JSON.stringify(pendingObj));
    }
    function getPending(){
      try{ return JSON.parse(localStorage.getItem(KEY_PENDING) || "null"); }catch{ return null; }
    }
    function clearPending(){
      localStorage.removeItem(KEY_PENDING);
    }

    // 採用（確定）→ 明日用として保存、採用回数/トップ更新
    function finalizeAdopt(obj){
      // obj: { date, adoptFor, charId, charName, overall, rank, money,love,work,health, lines }
      localStorage.setItem(KEY_ADOPT, JSON.stringify(obj));

      // 採用回数
      let counts = {};
      try{ counts = JSON.parse(localStorage.getItem(KEY_COUNTS) || "{}"); }catch{}
      counts[obj.charId] = (counts[obj.charId] || 0) + 1;
      localStorage.setItem(KEY_COUNTS, JSON.stringify(counts));

      // トップに出すキャラ
      localStorage.setItem(KEY_LASTTOP, obj.charId);

      clearPending();
      setTopFromStorage();
    }

    // 親切②：離脱/非表示になったら pending を採用に昇格
    function autoFinalizeIfPending(){
      const p = getPending();
      if(!p) return;
      // 同日のpendingだけ確定（古いのは捨てる）
      if(p.date === TODAY){
        finalizeAdopt(p);
      }else{
        clearPending();
      }
    }
    window.addEventListener("beforeunload", autoFinalizeIfPending);
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "hidden") autoFinalizeIfPending();
    });

    // 起動時にも pending があれば確定（押し忘れ救済）
    autoFinalizeIfPending();

    // =========================
    // Game flow
    // =========================
    let selectedChar = null;
    let questions = [];
    let idx = 0;
    let results = [];

    function renderQuestion(){
      progressEl.textContent = `${idx+1} / 7`;
      questionEl.textContent = questions[idx];
      charImg.style.opacity = 1;
      charImg.src = selectedChar.img1;
    }

    async function onAnswer(){
      const v = Math.floor(Math.random() * 101);
      results.push(v);

      answersEl.classList.add("locked");
      await waitMs(220);
      answersEl.classList.remove("locked");

      idx++;
      if(idx >= 7){
        await finish();
      }else{
        renderQuestion();
      }
    }

    answersEl.addEventListener("click", (e)=>{
      const btn = e.target.closest("button");
      if(!btn) return;
      if(answersEl.classList.contains("locked")) return;
      onAnswer();
    });

    // 「結果」表示後、採用ボタンを押すまで次へ進めない（強制採用でも同じ）
    let canProceed = false;
    function setResultButtonsLocked(lock){
      canProceed = !lock;
      btnNextChar.disabled = lock;
      btnNextChar.style.opacity = lock ? 0.35 : 1;
    }

    async function finish(){
      // 使用済みにする（1日1キャラ1回）
      markUsed(selectedChar.id);

      // 結果生成
      const overall = Math.floor(results.reduce((a,b)=>a+b,0) / results.length);
      const rank = getRank(overall);

      const money  = randNear(overall, 18);
      const love   = randNear(overall, 22);
      const work   = randNear(overall, 16);
      const health = randNear(overall, 14);

      // 画面
      setScreen("result");

      // UI初期化
      resultChar.style.opacity = 1;
      resultChar.src = selectedChar.img1;

      percentBig.textContent = "0%";
      rankText.textContent = "";
      resultLines.textContent = "";

      [barMoney,barLove,barWork,barHealth].forEach(b=>b.style.width="0%");
      [valMoney,valLove,valWork,valHealth].forEach(v=>v.textContent="0%");

      // 採用ボタン必須：次へはロック
      setResultButtonsLocked(true);

      // 最後の1キャラなら「強制採用」ヒントを出す（でも押すのは必須）
      forceHint.hidden = remainingCount() !== 0;

      // アニメ
      await countUpPercent(percentBig, overall, 900);
      rankText.textContent = rank;
      resultLines.textContent = buildLines(overall, rank);

      await waitMs(140);
      setStat(barMoney,  valMoney,  money);
      await waitMs(90);
      setStat(barLove,   valLove,   love);
      await waitMs(90);
      setStat(barWork,   valWork,   work);
      await waitMs(90);
      setStat(barHealth, valHealth, health);

      // 7コマ（全キャラ）
      await playSequence(resultChar, selectedChar);

      // ★親切②：ここで「仮採用（pending）」として自動保存しておく
      const pendingObj = {
        date: TODAY,
        adoptFor: tomorrowYmd(), // 明日用
        charId: selectedChar.id,
        charName: selectedChar.name,
        overall, rank,
        money, love, work, health,
        lines: resultLines.textContent
      };
      setPending(pendingObj);
    }

    // 採用ボタン：pending → 採用確定
    btnAdopt.addEventListener("click", ()=>{
      const p = getPending();
      if(!p) return;

      finalizeAdopt(p);

      // 次へ進める
      setResultButtonsLocked(false);

      // もし残り0なら、次ボタンを「トップへ」に切り替え
      if(remainingCount() === 0){
        btnNextChar.textContent = "トップへ";
      }else{
        btnNextChar.textContent = "次のキャラを占う";
      }
    });

    // 次のキャラを占う / トップへ
    btnNextChar.addEventListener("click", ()=>{
      if(!canProceed) return; // 採用押してないなら進めない

      if(remainingCount() === 0){
        setScreen("top");
        return;
      }
      // 次の占い（別キャラを選ばせる）
      openModalFiltered();
    });

    // =========================
    // Modal: 未使用キャラだけ見せる
    // =========================
    let modalPool = [];
    function openModalFiltered(){
      modalPool = CHAR_LIST.filter(c=>!isUsed(c.id));
      if(modalPool.length === 0){
        // 全部使ったならトップ
        setScreen("top");
        return;
      }
      pickIndex = 0;
      renderPickFromPool();
      modalBack.classList.add("on");
      modalBack.setAttribute("aria-hidden","false");
    }
    function renderPickFromPool(){
      const c = modalPool[pickIndex];
      pickImg.src = c.img1;
      pickImg.alt = c.name;
      pickName.textContent = c.name;
      pickDesc.textContent = c.desc;
    }
    function closeModalFiltered(){
      modalBack.classList.remove("on");
      modalBack.setAttribute("aria-hidden","true");
    }
    btnPrev.addEventListener("click", (e)=>{
      if(modalPool.length){
        e.stopPropagation();
        pickIndex = (pickIndex - 1 + modalPool.length) % modalPool.length;
        renderPickFromPool();
      }
    });
    btnNext.addEventListener("click", (e)=>{
      if(modalPool.length){
        e.stopPropagation();
        pickIndex = (pickIndex + 1) % modalPool.length;
        renderPickFromPool();
      }
    });

    // START → キャラ選択（未使用のみ）
    function goStartFlow(){
      fade.classList.add("on");
      setTimeout(()=>{
        fade.classList.remove("on");
        openModalFiltered();
      }, 220);
    }
    btnStart.addEventListener("click", (e)=>{ e.stopPropagation(); goStartFlow(); });
    screenTop.addEventListener("click", ()=>{ goStartFlow(); }, { passive:true });

    // モーダル決定
    btnChoose.addEventListener("click", (e)=>{
      e.stopPropagation();
      const chosen = modalPool.length ? modalPool[pickIndex] : CHAR_LIST[pickIndex];
      selectedChar = chosen;

      closeModalFiltered();

      questions = pick7();
      idx = 0;
      results = [];

      fade.classList.add("on");
      setTimeout(()=>{
        fade.classList.remove("on");
        setScreen("game");
        renderQuestion();
      }, 220);
    });

    // =========================
    // Init
    // =========================
    setScreen("top");

    // top: 直近採用キャラを表示
    setTopFromStorage();

    // もし今日はもう全部使い切ってたらヒントを変える（任意）
    if(remainingCount() === 0){
      topMini.textContent = "※今日はもう占い切った。明日また来い。";
    }
  </script>
</body>
</html>
